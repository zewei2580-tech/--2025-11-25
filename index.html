    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f4f4f5;
        color: #18181b;
        overflow: hidden;
        overscroll-behavior: none;
      }
      
      /* Dark mode overrides for panels */
      .dark-panel {
        background-color: #09090b;
        color: #f4f4f5;
        border-color: #27272a;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Canvas dot grid */
      .dot-grid {
        background-image: radial-gradient(#d4d4d8 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Transitions - Removed .transition-canvas for CAD performance */

      /* Custom Range Input Styling */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]:focus {
        outline: none;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #27272a;
        border-radius: 2px;
      }
      input[type=range]::-webkit-slider-thumb {
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
      }

      /* Advanced AI Loading Animations */
      @keyframes neural-shimmer {
        0% { transform: translateX(-150%) skewX(-15deg); }
        50% { transform: translateX(150%) skewX(-15deg); }
        100% { transform: translateX(150%) skewX(-15deg); }
      }

      @keyframes organic-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(5px, -10px) scale(1.05); }
        66% { transform: translate(-5px, 5px) scale(0.95); }
      }

      @keyframes rotation-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      .mesh-gradient-bg {
        background: linear-gradient(135deg, #09090b 0%, #1e1b4b 50%, #09090b 100%);
        background-size: 400% 400%;
        animation: gradient-flow 10s ease infinite;
      }

      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .shimmer-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(99, 102, 241, 0.1), rgba(255, 255, 255, 0.05), transparent);
        animation: neural-shimmer 2.5s infinite;
      }

      .ai-ring {
        position: absolute;
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 50%;
        animation: pulse-ring 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite;
      }
    </style>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

      window.gtag = gtag;

      const originalCreateElement = document.createElement;
      document.createElement = function(tagName) {
        const element = originalCreateElement.call(document, tagName);
        if (tagName.toLowerCase() === 'script') {
          const originalSetAttribute = element.setAttribute;
          element.setAttribute = function(name, value) {
            if (name === 'src' && (value.includes('googletagmanager') || value.includes('google-analytics'))) {
              return; 
            }
            originalSetAttribute.call(element, name, value);
          };
          Object.defineProperty(element, 'src', {
            set(value) {
              if (value.includes('googletagmanager') || value.includes('google-analytics')) {
                return;
              }
              element.setAttribute('src', value);
            },
            get() {
              return element.getAttribute('src');
            }
          });
        }
        return element;
      };
    </script>
